<h1>معنى البدعة وحكم الصلاة خلف صاحبها</h1><h2>السؤال:</h2><p>ما هي البدعة؟ وهل أصلي خلف مبتدع؟</p>
<h2>الجواب:</h2><p>البدعة هي العبادة المحدثة التي لم يأت بها الشرع.</p>
<p>المقدم: والصلاة خلف هذا الإمام؟</p><p>الشيخ: إن كانت بدعته غير مكفرة فلا بأس مع نصحه.</p>
<a href="/categories/fiqhi/22/fatwa">الصلاة</a><h3>فتاوى ذات صلة</h3>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daleel-api"
version = "0.1.0"
description = "Source-grounded multilingual approved Islamic knowledge retrieval API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "python-multipart>=0.0.20,<1",
  "typer>=0.15,<1",
  "numpy>=2.0,<3",
  "openai>=3.22,<4",
  "sentence-transformers>=6.1,<7"
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.0,<2", "respx>=0.22,<1"]

[project.scripts]
daleel-ingest = "app.ingestion.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

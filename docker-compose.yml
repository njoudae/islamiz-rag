services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daleel}
      POSTGRES_USER: ${POSTGRES_USER:-daleel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daleel} -d ${POSTGRES_DB:-daleel}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - daleel_pg:/var/lib/postgresql/data
      - ./infra/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
volumes:
  daleel_pg:

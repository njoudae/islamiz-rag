# Daleel — full local stack.
#
#   cp .env.example .env      # then set OPENAI_API_KEY
#   docker compose up --build
#
#   Visitor site   http://localhost:8080
#   Admin area     http://localhost:8080/login
#
# Request path:  browser -> site (Laravel + Vue) -> ai (FastAPI)
# The site keeps its own data in postgres; the AI service answers from a file index.
# The browser never talks to the AI service directly.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daleel}
      POSTGRES_USER: ${POSTGRES_USER:-daleel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daleel} -d ${POSTGRES_DB:-daleel}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - daleel_pg:/var/lib/postgresql/data

  # RAG pipeline: retrieval, grounded source selection, generation.
  # On first start it downloads the embedding model (about 2.3 GB).
  ai:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in your local .env file}
      OPENAI_GENERATION_MODEL: ${OPENAI_GENERATION_MODEL:-gpt-6.1-sol}
      CONVERSATION_DB_PATH: /srv/daleel/data/conversations.sqlite3
      RETRIEVAL_DEVICE: ${RETRIEVAL_DEVICE:-cpu}
      INTERNAL_API_TOKEN: ${AI_SERVICE_TOKEN:-local-internal-token}
    ports:
      # Loopback only: for /health and /docs during development, not for browsers.
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    volumes:
      - daleel_models:/models
      - daleel_conversations:/srv/daleel/data

  # The website: visitor pages, public API, question log and admin area.
  site:
    build:
      context: apps/site
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: Daleel
      APP_URL: http://localhost:${SITE_PORT:-8080}
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-daleel}
      DB_USERNAME: ${POSTGRES_USER:-daleel}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SCHEMA: site
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      INERTIA_SSR_ENABLED: "false"
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-internal-token}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@daleel.sa}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-daleel-admin-2026}
      ADMIN_SHOW_CREDENTIALS: ${ADMIN_SHOW_CREDENTIALS:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-contact@daleel.sa}
    ports:
      - "${SITE_PORT:-8080}:8080"
    volumes:
      - daleel_site:/app/storage/app/private

volumes:
  daleel_pg:
  daleel_models:
  daleel_conversations:
  daleel_site:
